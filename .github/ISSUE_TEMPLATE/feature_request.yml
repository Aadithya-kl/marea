name: Feature request
description: Suggest a source, a tool integration or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New source (Ollama, Civitai, PyPI, ...)
        - Tide / automation
        - User interface
        - Translations
        - macOS / Linux
        - Other
